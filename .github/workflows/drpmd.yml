name: dRPMD

on:
  push:
    paths:
      - "rpmdrate/drpmd*.py"
      - "rpmdrate/_drpmd_native.c"
      - "rpmdrate/_main.f90"
      - "rpmdrate/_math.f90"
      - "rpmdrate/_surface.f90"
      - "rpmdrate.py"
      - "tests/drpmd*.py"
      - "examples/H-H-O-O/pes/txt_1014"
      - "examples/H-H-O-O/pes/hhoo_1014_analytic.f90"
      - "examples/drpmd/**"
      - "requirements-drpmd*.txt"
      - "Makefile"
      - ".github/workflows/drpmd.yml"
  pull_request:
    paths:
      - "rpmdrate/drpmd*.py"
      - "rpmdrate/_drpmd_native.c"
      - "rpmdrate/_main.f90"
      - "rpmdrate/_math.f90"
      - "rpmdrate/_surface.f90"
      - "rpmdrate.py"
      - "tests/drpmd*.py"
      - "examples/H-H-O-O/pes/txt_1014"
      - "examples/H-H-O-O/pes/hhoo_1014_analytic.f90"
      - "examples/drpmd/**"
      - "requirements-drpmd*.txt"
      - "Makefile"
      - ".github/workflows/drpmd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "2"

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install direct-RPMD dependencies
        run: python -m pip install -r requirements-drpmd.txt
      - name: Install reference compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc gfortran
      - name: Build the reentrant OpenMP Cayley kernel
        run: python -m rpmdrate.drpmd_integrator --build --compiler gcc
      - name: Run direct-RPMD regressions
        # This independent path does not build the legacy numpy.distutils/f2py code.
        run: python -m unittest discover -s tests -t . -p 'drpmd*test.py' -v

  torch-reference:
    name: Optional PyTorch backend / CPU reference
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install -r requirements-drpmd.txt
      - name: Install reference compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc gfortran
      - name: Install the CPU build of PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build the OpenMP Cayley kernel
        run: python -m rpmdrate.drpmd_integrator --build --compiler gcc
      - name: Compare HHOO energies and autograd gradients with the analytic PES
        # CUDA comparisons skip on this CPU runner; this is not a GPU benchmark.
        run: python -m unittest discover -s tests -t . -p 'drpmd*test.py' -v

  four-hhoo:
    name: Four HHOO trajectories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-drpmd.txt
      - name: Run four HHOO trajectories
        env:
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m rpmdrate.drpmd examples/drpmd/hhoo_smoke.json --mode serial --trajectories 4 --output four-hhoo-results
          echo "=== TRAJECTORIES ==="
          cat four-hhoo-results/trajectories.csv
          echo "=== SUMMARY ==="
          cat four-hhoo-results/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hhoo-four-trajectories
          path: four-hhoo-results/
