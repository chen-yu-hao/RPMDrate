name: dRPMD CPU scaling (32 beads, 1 ps)

on:
  push:
    branches: ["bench/32beads-1ps-cpu-scaling"]
    paths:
      - "benchmarks/**"
      - ".github/workflows/drpmd_scaling.yml"
      - "rpmdrate/drpmd*.py"
      - "rpmdrate/_drpmd_native.c"
      - "examples/drpmd/hhoo_smoke.json"
  pull_request:
    branches: ["feat/thermal-drpmd"]
    paths:
      - "benchmarks/**"
      - ".github/workflows/drpmd_scaling.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drpmd-scaling-cpu
  cancel-in-progress: true

jobs:
  scaling:
    name: 32 beads / 1 ps / 1, 2 and 4 CPU cores
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install CPU dependencies and plotting
        run: python -m pip install -r requirements-drpmd.txt matplotlib
      - name: Build native OpenMP Cayley
        run: python -m rpmdrate.drpmd_integrator --build --compiler gcc
      - name: Runner CPU information
        run: |
          nproc
          lscpu | grep -E 'CPU\(s\)|Model name|Thread|Core|Socket' || true
          cat /sys/fs/cgroup/cpu.max || true
      - name: Benchmark 1, 2, 4 cores (two repetitions)
        run: |
          python -m benchmarks.drpmd_cpu_scaling \
            --input examples/drpmd/hhoo_smoke.json \
            --nbeads 32 --duration-ps 1.0 --repeats 2 \
            --output bench-results-32beads-1ps
      - name: Render scaling figure
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import numpy as np
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          out = Path("bench-results-32beads-1ps")
          with (out / "scaling.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          cores = [int(x["cores"]) for x in rows]
          median = np.array([float(x["median_collision_seconds"]) for x in rows])
          low = np.array([float(x["min_collision_seconds"]) for x in rows])
          high = np.array([float(x["max_collision_seconds"]) for x in rows])
          fig, ax = plt.subplots(figsize=(7, 4.5))
          bars = ax.bar(range(len(cores)), median, color=["#637B95", "#3C8A8D", "#1C6F85"],
                        yerr=np.vstack((median - low, high - median)), capsize=5)
          ax.set_xticks(range(len(cores)), [str(x) for x in cores])
          ax.set_xlabel("CPU cores")
          ax.set_ylabel("Collision propagation (seconds per 1 ps)")
          ax.set_title("HHOO dRPMD | 32 beads | 1 ps | 10,000 steps")
          ax.grid(axis="y", alpha=0.2)
          ax.set_axisbelow(True)
          for bar, row in zip(bars, rows):
              ax.text(bar.get_x() + bar.get_width()/2, bar.get_height(),
                      f"{float(row['speedup']):.2f}x", ha="center", va="bottom", fontsize=10)
          ax.set_ylim(0, max(high)*1.2)
          fig.tight_layout()
          fig.savefig(out / "cpu_scaling.png", dpi=180)
          plt.close(fig)
          PY
      - name: Store summary in GitHub Actions step report
        if: always()
        run: |
          if [ -f bench-results-32beads-1ps/REPORT.md ]; then
            cat bench-results-32beads-1ps/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark outputs (including all six trajectories)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drpmd-cpu-scaling-32beads-1ps
          path: bench-results-32beads-1ps/
          if-no-files-found: warn
          retention-days: 30
