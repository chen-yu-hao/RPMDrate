name: HHOO 32-bead thermal convergence pilot
on:
  push:
    branches: ["experiment/hhoo-thermal-impact-512"]
    paths:
      - ".github/workflows/hhoo_thermal_pilot.yml"
      - "benchmarks/hhoo_thermal_diagnostics.py"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: hhoo-thermal-pilot
  cancel-in-progress: false

jobs:
  thermal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install numerical and plotting dependencies
        run: python -m pip install -r requirements-drpmd.txt matplotlib
      - name: Build native serial Cayley
        run: python -m rpmdrate.drpmd_integrator --build --compiler gcc
      - name: Run 4 parallel independent 20ps thermal parent chains
        run: |
          python -m benchmarks.hhoo_thermal_diagnostics \
            --input examples/drpmd/hhoo_smoke.json \
            --output thermal-pilot-32b \
            --nbeads 32 --length-ps 20 --stride-fs 10 \
            --burn-fraction 0.50
      - name: Print pilot summary
        if: always()
        run: |
          if [ -f thermal-pilot-32b/convergence_report.json ]; then
            cat thermal-pilot-32b/convergence_report.json
          fi
      - name: Upload pilot observables and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hhoo-thermal-32b-four-chains
          path: thermal-pilot-32b/
          if-no-files-found: warn
          retention-days: 30
